# Cài một lần, chạy ở gốc repo: uv run pre-commit install (pre-commit nằm trong nhóm dev)
# Xem docs/architecture/11-git-workflow.md mục 3.4 và 8.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      # File sinh: hook sửa nó thì `gen_openapi.py --check` lệch mãi (12 mục 5)
      - id: end-of-file-fixer
        exclude: ^openapi\.yaml$
      - id: trailing-whitespace
        exclude: ^openapi\.yaml$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy và import-linter cần môi trường của project, nên chạy bằng uv ở gốc repo.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        files: \.py$
        pass_filenames: false
      - id: lint-imports
        name: import-linter
        entry: bash -c 'PYTHONUTF8=1 uv run lint-imports'
        language: system
        files: \.py$
        pass_filenames: false

  # Commit message không được nhắc tới Claude (kể cả trailer `Co-Authored-By`), không phân biệt hoa thường.
  # sed dừng ở dòng cắt `>8` mà `git commit -v` chèn trước diff, và bỏ dòng comment `#`
  - repo: local
    hooks:
      - id: no-claude-in-commit-msg
        name: no "claude" in commit message
        entry: >-
          bash -c 'msg=$(sed -n "/^# -* >8 -*\$/q;/^#/d;p" "$1"); if grep -qi claude <<< "$msg"; then echo "Commit message chứa chữ \"claude\": bỏ đi rồi commit lại." >&2; grep -ni claude <<< "$msg" >&2; exit 1; fi' --
        language: system
        stages: [commit-msg]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
