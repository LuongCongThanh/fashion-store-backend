openapi: 3.0.3
info:
  title: Fashion Store API
  version: 0.1.0
  description: |
    API of Fashion Store. Two applications share it:

    - `store` (`/api/v1/store/`): the storefront for customers and guests.
    - `backoffice` (`/api/v1/backoffice/`): the back-office for Staff and Admin.

    Only the Next.js BFF calls the `store` and `backoffice` APIs; browsers never call Django directly.

    ## Authentication

    1. Call `POST /api/v1/backoffice/auth/login` with a staff email and password.
    2. Click **Authorize** and paste the `access_token` from the response.

    ## Errors

    Every error response uses `ErrorDTO`:
    `{"error": {"code", "message", "details", "request_id"}}`.
    `code` is stable; `message` is translated by `Accept-Language` (default `vi`);
    `request_id` matches the server logs.

    ## Common headers

    - `Accept-Language`: `vi` (default) or `en`; affects `error.message` only.
    - `X-Request-ID`: request ID forwarded by the BFF, returned as `error.request_id`.
    - `Idempotency-Key`: UUID required by operations that must not run twice (checkout, payments,
      stock changes).
paths:
  /api/v1/backoffice/auth/login:
    post:
      operationId: v1_backoffice_auth_login_create
      summary: Log in to the back office
      tags:
      - backoffice · identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            examples:
              StaffLogin:
                value:
                  email: staff@example.com
                  password: correct-horse-battery
                summary: Staff login
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairDTO'
              examples:
                TokenPair:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiJ9.example-access.signature
                    refresh_token: eyJhbGciOiJIUzI1NiJ9.example-refresh.signature
                    token_type: Bearer
                    expires_in: 600
                  summary: Token pair
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                VALIDATION_ERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Invalid input.
                      details:
                        fields:
                          field_name:
                          - This field is required.
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Invalid request (`VALIDATION_ERROR`, `PARSE_ERROR`, `BAD_REQUEST`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                InvalidCredentials:
                  value:
                    error:
                      code: INVALID_CREDENTIALS
                      message: Invalid email or password.
                      details: {}
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
                  summary: Invalid credentials
          description: Invalid email or password (`INVALID_CREDENTIALS`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                THROTTLED:
                  value:
                    error:
                      code: THROTTLED
                      message: Request was throttled. Expected available in 30 seconds.
                      details: {}
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Too many requests (`THROTTLED`); retry after `Retry-After`
            seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                INTERNAL_ERROR:
                  value:
                    error:
                      code: INTERNAL_ERROR
                      message: Internal server error.
                      details: {}
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Internal error (`INTERNAL_ERROR`).
  /api/v1/backoffice/auth/me:
    get:
      operationId: v1_backoffice_auth_me_retrieve
      summary: Get the signed-in staff account
      tags:
      - backoffice · identity
      security:
      - BackofficeBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDTO'
              examples:
                StaffAccount:
                  value:
                    id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    created_at: '2026-01-15T08:30:00+07:00'
                    updated_at: '2026-03-02T10:00:00+07:00'
                    email: staff@example.com
                    kind: staff
                    full_name: Example Staff
                    phone: '+84900000000'
                    language: vi
                    is_active: true
                    email_verified: true
                  summary: Staff account
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                VALIDATION_ERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Invalid input.
                      details:
                        fields:
                          field_name:
                          - This field is required.
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Invalid request (`VALIDATION_ERROR`, `PARSE_ERROR`, `BAD_REQUEST`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                NOT_AUTHENTICATED:
                  value:
                    error:
                      code: NOT_AUTHENTICATED
                      message: Authentication credentials were not provided.
                      details: {}
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Not authenticated or invalid token (`NOT_AUTHENTICATED`, `TOKEN_EXPIRED`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                PERMISSION_DENIED:
                  value:
                    error:
                      code: PERMISSION_DENIED
                      message: You do not have permission to perform this action.
                      details: {}
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Insufficient permissions (`PERMISSION_DENIED`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                THROTTLED:
                  value:
                    error:
                      code: THROTTLED
                      message: Request was throttled. Expected available in 30 seconds.
                      details: {}
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Too many requests (`THROTTLED`); retry after `Retry-After`
            seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                INTERNAL_ERROR:
                  value:
                    error:
                      code: INTERNAL_ERROR
                      message: Internal server error.
                      details: {}
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Internal error (`INTERNAL_ERROR`).
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                AUTH_STATE_UNAVAILABLE:
                  value:
                    error:
                      code: AUTH_STATE_UNAVAILABLE
                      message: Authentication state is temporarily unavailable.
                      details: {}
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Authentication state could not be verified in the database
            (`AUTH_STATE_UNAVAILABLE`).
  /api/v1/store/geo/provinces:
    get:
      operationId: v1_store_geo_provinces_list
      summary: List provinces
      tags:
      - store · geo
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeoDTO'
              examples:
                Province:
                  value:
                  - code: '01'
                    name: Ha Noi
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                VALIDATION_ERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Invalid input.
                      details:
                        fields:
                          field_name:
                          - This field is required.
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Invalid request (`VALIDATION_ERROR`, `PARSE_ERROR`, `BAD_REQUEST`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                THROTTLED:
                  value:
                    error:
                      code: THROTTLED
                      message: Request was throttled. Expected available in 30 seconds.
                      details: {}
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Too many requests (`THROTTLED`); retry after `Retry-After`
            seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                INTERNAL_ERROR:
                  value:
                    error:
                      code: INTERNAL_ERROR
                      message: Internal server error.
                      details: {}
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Internal error (`INTERNAL_ERROR`).
  /api/v1/store/geo/provinces/{code}/wards:
    get:
      operationId: v1_store_geo_provinces_wards_list
      summary: List wards of a province
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - store · geo
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeoDTO'
              examples:
                Ward:
                  value:
                  - code: '00004'
                    name: Ba Dinh
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                VALIDATION_ERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Invalid input.
                      details:
                        fields:
                          field_name:
                          - This field is required.
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Invalid request (`VALIDATION_ERROR`, `PARSE_ERROR`, `BAD_REQUEST`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                NOT_FOUND:
                  value:
                    error:
                      code: NOT_FOUND
                      message: Not found.
                      details: {}
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Not found (`NOT_FOUND`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                THROTTLED:
                  value:
                    error:
                      code: THROTTLED
                      message: Request was throttled. Expected available in 30 seconds.
                      details: {}
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Too many requests (`THROTTLED`); retry after `Retry-After`
            seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                INTERNAL_ERROR:
                  value:
                    error:
                      code: INTERNAL_ERROR
                      message: Internal server error.
                      details: {}
                      request_id: 3f2b8c1e-5d4a-4f6b-9c7e-1a2b3c4d5e6f
          description: Internal error (`INTERNAL_ERROR`).
components:
  schemas:
    AccountDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        email:
          type: string
          format: email
        kind:
          $ref: '#/components/schemas/KindEnum'
        full_name:
          type: string
        phone:
          type: string
        language:
          $ref: '#/components/schemas/LanguageEnum'
        is_active:
          type: boolean
        email_verified:
          type: boolean
      required:
      - created_at
      - email
      - email_verified
      - full_name
      - id
      - is_active
      - kind
      - language
      - phone
      - updated_at
    ErrorDTO:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable error code; the frontend translates by code.
            message:
              type: string
              description: Default message in the language of `Accept-Language`.
            details:
              type: object
              additionalProperties: {}
              description: 'Details by code. `VALIDATION_ERROR`: `{fields: {field_path:
                string[]}}`; codes without details: `{}`.'
            request_id:
              type: string
              description: Request ID for looking up logs.
          required:
          - code
          - message
          - details
          - request_id
      required:
      - error
    GeoDTO:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
        name:
          type: string
          maxLength: 255
      required:
      - code
      - name
    KindEnum:
      enum:
      - customer
      - staff
      - admin
      type: string
      description: |-
        * `customer` - Customer
        * `staff` - Staff
        * `admin` - Admin
    LanguageEnum:
      enum:
      - vi
      - en
      type: string
      description: |-
        * `vi` - Vi
        * `en` - En
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    TokenPairDTO:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          minimum: 1
      required:
      - access_token
      - expires_in
      - refresh_token
      - token_type
  securitySchemes:
    BackofficeBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
